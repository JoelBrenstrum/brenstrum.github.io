<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>the brenstrums</title>
  <meta name="description" content="the brenstrum family — heather, terry and the kids.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1814" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://brenstrum.com/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://brenstrum.com/">
  <meta property="og:title" content="the brenstrums">
  <meta property="og:description" content="the brenstrum family — heather, terry and the kids.">
  <meta property="og:image" content="https://brenstrum.com/family.jpg">
  <meta property="og:image:alt" content="the brenstrum family together">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="family.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <figure class="print">
      <picture>
        <source srcset="family.webp" type="image/webp">
        <img src="family.jpg" width="1600" height="1081" decoding="async" fetchpriority="high"
             alt="the brenstrum family together">
      </picture>
    </figure>

    <h1>the brenstrums</h1>

    <ul class="names parents" id="parents" aria-label="parents"></ul>
    <ul class="names kids" id="kids" aria-label="kids and partners"></ul>
  </main>

  <script>
    /*
      the family. add someone by adding one line.
      url is optional; a partner is optional and takes the same { name, url? } shape.
    */
    const parents = [
      { name: "heather", partner: { name: "terry" } },
    ];

    const kids = [
      { name: "joel", url: "https://joel.brenstrum.com",
        partner: { name: "jaimi", url: "https://jaimi.brenstrum.com" } },
      { name: "leah",  partner: { name: "alan" } },
      { name: "alyse", partner: { name: "terry" } },
      { name: "tammy" },
    ];

    const person = ({ name, url }, cls) => {
      const el = document.createElement(url ? "a" : "span");
      if (url) el.href = url;
      if (cls) el.className = cls;
      el.textContent = name;
      return el;
    };

    // two interlocking rings between married couples; screen readers hear "married to"
    const rings = () => {
      const s = document.createElement("span");
      s.className = "rings";
      s.innerHTML =
        '<svg viewBox="0 0 24 16" width="24" height="16" aria-hidden="true" focusable="false">' +
        '<circle cx="8.5" cy="8" r="5.5"/><circle cx="15.5" cy="8" r="5.5"/></svg>' +
        '<span class="visually-hidden">married to</span>';
      return s;
    };

    const fill = (id, list) => {
      const ul = document.getElementById(id);
      for (const p of list) {
        const li = document.createElement("li");
        li.append(person(p));
        if (p.partner) li.append(rings(), person(p.partner, "partner"));
        ul.append(li);
      }
    };

    fill("parents", parents);
    fill("kids", kids);
  </script>
</body>
</html>
